# Rotation des logs du pipeline MailGuard Pro.
# Installer :
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/mailguardpro-prospecting
# Adapter le chemin si le projet n'est pas dans /opt/mailguardpro-prospecting.

/opt/mailguardpro-prospecting/data/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
