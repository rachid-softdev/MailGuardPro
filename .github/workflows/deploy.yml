name: Deploy

# Manual-only. No deployment environment has been provisioned (the production
# environment has no host, database, Redis, or SSH secrets configured), so every
# push to main failed at the build step. Restore a `push` trigger once the
# environment exists and its secrets are set.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.mailguard.pro

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mailguardpro/web exec prisma generate

      - name: Build application
        run: pnpm --filter @mailguardpro/web run build
        # Module-level env validation requires these at build time
        # (see lib/stripe.ts, lib/resend.ts, lib/redis.ts, lib/auth.ts,
        #  lib/emailHash.ts, lib/ipHash.ts). Keep in sync with .env.example.
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          AUTH_URL: https://staging.mailguard.pro
          NEXT_PUBLIC_APP_URL: https://staging.mailguard.pro
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.STAGING_EMAIL_FROM }}
          EMAIL_HASH_SALT: ${{ secrets.STAGING_EMAIL_HASH_SALT }}
          IP_HASH_KEY: ${{ secrets.STAGING_IP_HASH_KEY }}
          API_KEY_PEPPER: ${{ secrets.STAGING_API_KEY_PEPPER }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_TOKEN_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.STAGING_STRIPE_PUBLIC_KEY }}
          STRIPE_STARTER_PRICE_ID: ${{ secrets.STAGING_STRIPE_STARTER_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STAGING_STRIPE_PRO_PRICE_ID }}
          STRIPE_BUSINESS_PRICE_ID: ${{ secrets.STAGING_STRIPE_BUSINESS_PRICE_ID }}
          STRIPE_STARTER_ANNUAL_PRICE_ID: ${{ secrets.STAGING_STRIPE_STARTER_ANNUAL_PRICE_ID }}
          STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.STAGING_STRIPE_PRO_ANNUAL_PRICE_ID }}
          STRIPE_BUSINESS_ANNUAL_PRICE_ID: ${{ secrets.STAGING_STRIPE_BUSINESS_ANNUAL_PRICE_ID }}
          AUTH_GOOGLE_ID: ${{ secrets.STAGING_AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.STAGING_AUTH_GOOGLE_SECRET }}

      - name: Deploy to staging server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/mailguard-pro
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm exec prisma migrate deploy
            pnpm run build
            sudo systemctl restart mailguard-pro

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: https://mailguard.pro

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mailguardpro/web exec prisma generate

      - name: Build application
        run: pnpm --filter @mailguardpro/web run build
        # Module-level env validation requires these at build time
        # (see lib/stripe.ts, lib/resend.ts, lib/redis.ts, lib/auth.ts,
        #  lib/emailHash.ts, lib/ipHash.ts). Keep in sync with .env.example.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
          AUTH_URL: https://mailguard.pro
          NEXT_PUBLIC_APP_URL: https://mailguard.pro
          RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.PRODUCTION_EMAIL_FROM }}
          EMAIL_HASH_SALT: ${{ secrets.PRODUCTION_EMAIL_HASH_SALT }}
          IP_HASH_KEY: ${{ secrets.PRODUCTION_IP_HASH_KEY }}
          API_KEY_PEPPER: ${{ secrets.PRODUCTION_API_KEY_PEPPER }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_TOKEN_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.PRODUCTION_STRIPE_PUBLIC_KEY }}
          STRIPE_STARTER_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_STARTER_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_PRO_PRICE_ID }}
          STRIPE_BUSINESS_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_BUSINESS_PRICE_ID }}
          STRIPE_STARTER_ANNUAL_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_STARTER_ANNUAL_PRICE_ID }}
          STRIPE_PRO_ANNUAL_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_PRO_ANNUAL_PRICE_ID }}
          STRIPE_BUSINESS_ANNUAL_PRICE_ID: ${{ secrets.PRODUCTION_STRIPE_BUSINESS_ANNUAL_PRICE_ID }}
          AUTH_GOOGLE_ID: ${{ secrets.PRODUCTION_AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.PRODUCTION_AUTH_GOOGLE_SECRET }}

      - name: Run database migrations
        run: pnpm --filter @mailguardpro/web exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/mailguard-pro
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm exec prisma migrate deploy
            pnpm run build
            sudo systemctl restart mailguard-pro

      - name: Notify Slack
        # Only run when the secret is configured; silently skip otherwise
        # so a missing SLACK_WEBHOOK doesn't fail the deploy.
        if: ${{ env.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "Deploy ${{ job.status == 'success' && 'succeeded' || job.status == 'failure' && 'failed' || 'cancelled' }}: ${{ github.repository }}@${{ github.sha }}"}